name: Stable APK dry run

# Manual, non-publishing verification of the signed release variant. This workflow is for
# validating the exact production package before the tag-driven workflow is allowed to publish.
# It uploads an Actions artifact only; it never creates or updates a GitHub Release.
on:
  workflow_dispatch:

concurrency:
  group: stable-dry-run-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseG1GC"

jobs:
  verify:
    name: Build and verify signed stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: on-success
          cache-read-only: false

      - name: Read and validate stable metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^versionName=//p' version.properties | head -1)"
          VERSION_CODE="$(sed -n 's/^versionCode=//p' version.properties | head -1)"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::versionName is not stable: $VERSION_NAME"
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::versionCode is not positive: $VERSION_CODE"
            exit 1
          }

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decode protected release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SWIFTSLATE_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/swiftslate-release.keystore
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

      - name: Run release lint, tests and signed build
        shell: bash
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          KEYSTORE_FILE: ${{ runner.temp }}/swiftslate-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.SWIFTSLATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SWIFTSLATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SWIFTSLATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          ./gradlew lintRelease test :app:assembleRelease \
            --parallel \
            --no-build-cache \
            --no-configuration-cache \
            --no-daemon \
            --configuration-cache-problems=warn \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Verify stable package, shrinking and signature
        id: verify
        shell: bash
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"

          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/aapt"

          "$BUILD_TOOLS/zipalign" -c -P 4 -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          grep -F "package: name='com.jcversa.swiftslate' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING"
          ! grep -F "com.jcversa.swiftslate.preview" <<< "$BADGING"

          SIZE="$(stat -c%s "$APK")"
          test "$SIZE" -gt 100000
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          {
            echo "## Stable APK dry-run verification"
            echo
            echo "- Source branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: $VERSION_NAME (versionCode $VERSION_CODE)"
            echo "- APK: $SIZE bytes"
            echo "- SHA-256: $SHA256"
            echo "- Package: com.jcversa.swiftslate"
            echo "- Variant: release (R8 + resource shrinking)"
            echo "- Signature: apksigner verified"
            echo
            echo "This run uploaded an artifact only. No GitHub Release was published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare dry-run artifact
        shell: bash
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p dry-run-assets
          cp app/build/outputs/apk/release/app-release.apk \
            "dry-run-assets/SwiftSlate-v${VERSION_NAME}-stable-dry-run.apk"
          printf '%s\n' "$VERSION_CODE" > dry-run-assets/versionCode.txt
          sha256sum dry-run-assets/* > dry-run-assets/SHA256SUMS.txt

      - name: Upload signed dry-run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SwiftSlate-${{ github.ref_name }}-stable-dry-run
          path: dry-run-assets/
          retention-days: 30

      - name: Remove the temporary keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/swiftslate-release.keystore"
